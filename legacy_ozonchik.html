function cartPage(){let ids=Object.keys(cart),sum=ids.reduce((s,id)=>s+products[id-1].price*cart[id],0);return `<div class="section"><h2>Корзина</h2><small>${ids.length} позиций</small></div>${ids.length?`<div class="panel">${ids.map(id=>{let p=products[id-1];return `<div class="cartitem"><img src="${p.img}" alt=""><div class="grow"><div class="small">${p.name}</div><b>${money(p.price)}</b><div class="row" style="justify-content:space-between;margin-top:8px"><div class="step"><button onclick="qty(${id},-1)">−</button><b>${cart[id]}</b><button onclick="qty(${id},1)">+</button></div><button class="muted" style="background:none" onclick="qty(${id},-${cart[id]})">Удалить</button></div></div></div>`}).join('')}</div><div class="panel"><div class="row" style="justify-content:space-between"><b>Итого</b><b class="price">${money(sum)}</b></div><p class="muted small">Спишем ${money(sum)} с виртуального баланса. Настоящих платежей нет.</p><button class="bigbtn" onclick="checkout()">Оформить игровой заказ</button></div>`:`<div class="empty">🛒<strong>Корзина пуста</strong>Добавь понравившиеся товары из каталога.<p><button class="outline" onclick="go('catalog')">Перейти в каталог</button></p></div>`}`}
function checkout(){let ids=Object.keys(cart);if(!ids.length)return;let total=ids.reduce((s,id)=>s+products[id-1].price*cart[id],0);if(total>balance){toast('Недостаточно виртуальных денег');return}balance-=total;let order={id:Date.now(),created:Date.now(),items:ids.map(id=>({id:+id,qty:cart[id]})),total:ids.reduce((s,id)=>s+products[id-1].price*cart[id],0)};orders.unshift(order);cart={};save();tab='orders';render();scrollTo(0,0);toast('🎉 Игровой заказ оформлен!')}
function orderStatus(o){let mins=(Date.now()-o.created)/60000;return mins<1?0:mins<3?1:mins<5?2:3}function ordersPage(){return `<div class="section"><h2>Мои заказы</h2><small>${orders.length}</small></div>${orders.length?orders.map(o=>{let s=orderStatus(o),st=['Заказ оформлен','Собираем посылку','Посылка в пути','Доставлено 🎉'];return `<div class="panel"><div class="row" style="justify-content:space-between"><b>Заказ № ${String(o.id).slice(-7)}</b><span class="tag">Игровой</span></div><p class="small muted">${new Date(o.created).toLocaleString('ru-RU')} · ${o.items.reduce((a,x)=>a+x.qty,0)} шт.</p><h3>${st[s]}</h3>${st.map((t,i)=>`<div class="track" style="opacity:${i<=s?1:.35}"><div class="dot" style="background:${i<=s?'#075bff':'#cbd3e5'}"></div><span class="small">${t}</span></div>`).join('')}<p><b>${money(o.total)}</b> · оплачено виртуально</p><div class="row" style="overflow:auto">${o.items.slice(0,5).map(x=>`<img src="${products[x.id-1].img}" width="55" height="55" style="object-fit:cover;border-radius:8px" alt="">`).join('')}</div><button class="outline" style="margin-top:12px" onclick="reorder(${o.id})">Повторить заказ</button></div>`}).join(''):`<div class="empty">📦<strong>Заказов пока нет</strong>Сделай первую виртуальную покупку!</div>`}`}
function reorder(id){let o=orders.find(x=>x.id===id);if(!o)return;o.items.forEach(x=>cart[x.id]=(cart[x.id]||0)+x.qty);save();go('cart')}
function render(){if($('wallet'))$('wallet').textContent=money(balance);nav();$('app').innerHTML=detail?details():tab==='cart'?cartPage():tab==='orders'?ordersPage():listing();$('search').placeholder='Поиск по '+products.length+' товарам'}
$('search').addEventListener('input',e=>{query=e.target.value;category=-1;onlySale=false;tab='catalog';detail=null;visible=40;render()});render();
</script></body></html>
